<div id="queso" style="display: flex; flex-direction: column; height: 100%;">

    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });
    </script>

    <div id="options" style="border: 1px solid; padding: 8px; margin: 8px;">
        <div id="options_header" style="display: flex; align-items: center; gap: 8px;" onclick="toggleOptions()">
            <div id="options_arrow" style="user-select: none;"></div>
            <h2 style="margin: 0; cursor: default; user-select: none; padding-bottom: 8px;">options</h2>
        </div>
        <div id="options_container" style="display: flex; flex-wrap: wrap; gap: 16px;">
            <div style="flex: 1 0 250px; display: flex; flex-direction: column;">
                <h3 style="margin: 0; padding: 4px 0 4px 0;">options</h3>
                <label>
                    <input class="queso_input" id="thumb" type="checkbox">
                    thumb
                </label>
                <label>
                    <input class="queso_input" id="little" type="checkbox">
                    little endian
                </label>
                <label>
                    <input class="queso_input" id="output_address" type="checkbox">
                    output address
                </label>
                <label>
                    <input class="queso_input" id="output_opcode" type="checkbox">
                    output opcode
                </label>
                <label>
                    address offset
                    <input class="queso_input" type="text" size="10" value="" id="offset_input" maxlength="8"
                        placeholder="0x" style="font-family: monospace;">
                </label>

                <label>
                    architecture version
                    <select id="arch_version">
                        <option class="arch_version" value="armv1" id="armv1">ARMv1</option>
                        <option class="arch_version" value="armv2" id="armv2">ARMv2</option>
                        <option class="arch_version" value="armv2a" id="armv2a">ARMv2a</option>
                        <option class="arch_version" value="armv3" id="armv3">ARMv3</option>
                        <option class="arch_version" value="armv3m" id="armv3m">ARMv3M</option>
                        <option class="arch_version" value="armv4xm" id="armv4xm">ARMv4xM</option>
                        <option class="arch_version" value="armv4" id="armv4">ARMv4</option>
                        <option class="arch_version" value="armv4txm" id="armv4txm">ARMv4TxM</option>
                        <option class="arch_version" value="armv4t" id="armv4t">ARMv4T</option>
                        <option class="arch_version" value="armv5xm" id="armv5xm">ARMv5xM</option>
                        <option class="arch_version" value="armv5txm" id="armv5txm">ARMv5TxM</option>
                        <option class="arch_version" value="armv5" id="armv5">ARMv5</option>
                        <option class="arch_version" value="armv5t" id="armv5t">ARMv5T</option>
                        <option class="arch_version" value="armv5texp" id="armv5texp">ARMv5TExP</option>
                        <option class="arch_version" value="armv5te" id="armv5te">ARMv5TE</option>
                    </select>
                </label>


            </div>
            <div style="flex: 1 0 250px; display: flex; flex-direction: column;">
                <h3 style="margin: 0; padding: 4px 0 4px 0;">input method</h3>
                <label>
                    <input name="input_method" class="queso_input" type="radio" id="hexinput" value="hexinput"
                        onclick="toggleFileInput(false)" />
                    hex input
                </label>
                <label>
                    <input name="input_method" class="queso_input" type="radio" id="fileinput" value="fileinput"
                        onclick="toggleFileInput(true)" />
                    binary file input
                </label>
                <input class="queso_input" type="file" id="file_input_src" disabled>
            </div>

            <div style="flex: 1 0 250px; display: flex; flex-direction: column;">
                <h3 style="margin: 0; padding: 4px 0 4px 0;">register naming</h3>
                <label>
                    <input name="register_naming" class="queso_input" type="radio" id="conventional"
                        value="conventional" />
                    conventional (lr, pc)
                </label>
                <label>
                    <input name="register_naming" class="queso_input" type="radio" id="general" value="general" />
                    general (r14, r15)
                </label>
                <label>
                    <input name="register_naming" class="queso_input" type="radio" id="custom" value="custom" />
                    custom
                    <div style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
                        <input class="queso_input" type="text" size="1" value="r0" id="r0">
                        <input class="queso_input" type="text" size="1" value="r1" id="r1">
                        <input class="queso_input" type="text" size="1" value="r2" id="r2">
                        <input class="queso_input" type="text" size="1" value="r3" id="r3">
                        <input class="queso_input" type="text" size="1" value="r4" id="r4">
                        <input class="queso_input" type="text" size="1" value="r5" id="r5">
                        <input class="queso_input" type="text" size="1" value="r6" id="r6">
                        <input class="queso_input" type="text" size="1" value="r7" id="r7">
                        <input class="queso_input" type="text" size="1" value="r8" id="r8">
                        <input class="queso_input" type="text" size="1" value="r9" id="r9">
                        <input class="queso_input" type="text" size="1" value="r10" id="r10">
                        <input class="queso_input" type="text" size="1" value="r11" id="r11">
                        <input class="queso_input" type="text" size="1" value="r12" id="r12">
                        <input class="queso_input" type="text" size="1" value="r13" id="r13">
                        <input class="queso_input" type="text" size="1" value="r14" id="r14">
                        <input class="queso_input" type="text" size="1" value="r15" id="r15">
                    </div>
                </label>
            </div>

        </div>
    </div>

    <div id="split" style="display: flex; flex: 1; min-height: 0; padding: 8px; align-items: stretch;">
        <div id="left" style="min-width: 0; display: flex; flex-direction: column; width: 50%;">
            <h2 style="margin: 0 0 0 0; padding-bottom: 8px;">hex input</h2>
            <textarea class="queso_input" id="hex_input" autofocus
                placeholder="enter hex bytes (e.g. FFFFFFEA, 0EF0A0E1, 0600B0E8)"
                style="font-family: monospace; resize: none; width: 100%; flex: 1;"></textarea>
        </div>

        <div class="gutter" id="gutter" style="width: 16px; cursor: col-resize;"></div>

        <div id="right" style="min-width: 0; display: flex; flex-direction: column; flex: 1;">
            <h2 style="margin: 0 0 0 0; padding-bottom: 8px;">output</h2>
            <textarea id="disassembly" disabled
                style="font-family: monospace; resize: none; width: 100%; flex: 1;"></textarea>
        </div>
    </div>

    <script src="queso.js"></script>
    <script>
        const queso = document.getElementById("queso");
        function fitApp() {
            const top = queso.getBoundingClientRect().top + window.scrollY;
            const bottomGap = 120;
            queso.style.height = Math.max(400, window.innerHeight - top - bottomGap) + "px";
        }
        fitApp();
        window.addEventListener("resize", fitApp);
    </script>
</div>
